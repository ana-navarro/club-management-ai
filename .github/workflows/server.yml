name: Server Pipeline

# Runs when servers/club-management-server changes, and as part of the AI Pipeline.

on:
  push:
    branches: ['**']
    paths:
      - servers/club-management-server/**
      - servers/club-management-infra/docker-compose.yml
      - .github/workflows/server.yml
      - package.json
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: servers/club-management-server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test the development command
        working-directory: .
        run: npm run test:scripts

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate NGINX
        run: |
          mkdir -p "$RUNNER_TEMP/certs"
          docker run --rm -e CERTS_DIR=/certs \
            -v "$PWD/scripts:/scripts:ro" -v "$RUNNER_TEMP/certs:/certs" \
            --entrypoint sh alpine/openssl:3.5.2 /scripts/generate-certs.sh
          docker run --rm \
            --add-host client:127.0.0.1 \
            --add-host admin:127.0.0.1 \
            --add-host client-bff:127.0.0.1 \
            --add-host admin-bff:127.0.0.1 \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$RUNNER_TEMP/certs/gateway:/certs:ro" \
            nginx:1.29-alpine nginx -t
