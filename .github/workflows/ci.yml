name: AI Pipeline
run-name: AI Pipeline (${{ inputs.project_branch || github.ref_name }})

# Integrated pipeline: checks every project together. It runs on every commit in this repository,
# and every commit in a project repository triggers it with that project's branch. For each project
# it uses the branch with that name, or main if there is none.

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      project_branch:
        description: Branch to use in each project. Defaults to this run's branch.
        required: false
        type: string

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [club-management-client, club-management-admin]
    defaults:
      run:
        working-directory: project
    steps:
      - name: Resolve project branch
        id: ref
        working-directory: .
        env:
          URL: https://github.com/${{ github.repository_owner }}/${{ matrix.project }}.git
          BRANCH: ${{ inputs.project_branch || github.ref_name }}
        run: |
          if git ls-remote --exit-code "$URL" "refs/heads/$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.project }}
          ref: ${{ steps.ref.outputs.ref }}
          path: project

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: project/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type check and build
        run: npm run build

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Component tests (Storybook)
        run: |
          npx playwright install --with-deps chromium
          npm run test:storybook

  node-service:
    name: Service (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project:
          - club-management-users-svc
          - club-management-scheduling-svc
          - club-management-payment-svc
          - club-management-championshp-svc
    defaults:
      run:
        working-directory: project
    steps:
      - name: Resolve project branch
        id: ref
        working-directory: .
        env:
          URL: https://github.com/${{ github.repository_owner }}/${{ matrix.project }}.git
          BRANCH: ${{ inputs.project_branch || github.ref_name }}
        run: |
          if git ls-remote --exit-code "$URL" "refs/heads/$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.project }}
          ref: ${{ steps.ref.outputs.ref }}
          path: project

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: project/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

  python-bff:
    name: BFF (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [club-management-client-bff, club-management-admin-bff]
    defaults:
      run:
        working-directory: project
    steps:
      - name: Resolve project branch
        id: ref
        working-directory: .
        env:
          URL: https://github.com/${{ github.repository_owner }}/${{ matrix.project }}.git
          BRANCH: ${{ inputs.project_branch || github.ref_name }}
        run: |
          if git ls-remote --exit-code "$URL" "refs/heads/$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.project }}
          ref: ${{ steps.ref.outputs.ref }}
          path: project

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: project/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (Ruff)
        run: ruff check .

      - name: Type check
        run: mypy .

      - name: Unit tests with coverage
        run: python scripts/run_coverage.py

  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: club-management-client
            port: 8080
          - project: club-management-admin
            port: 8081
    steps:
      - uses: actions/checkout@v7

      - name: Get all projects
        env:
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ inputs.project_branch || github.ref_name }}
        run: |
          for path in             apps/club-management-client             apps/club-management-admin             services/club-management-client-bff             services/club-management-admin-bff             services/club-management-users-svc             services/club-management-scheduling-svc             services/club-management-payment-svc             services/club-management-championshp-svc; do
            url="https://github.com/$OWNER/$(basename "$path").git"
            ref=main
            if git ls-remote --exit-code "$url" "refs/heads/$BRANCH" >/dev/null; then
              ref=$BRANCH
            fi
            echo "$path: $ref"
            git clone --quiet --depth 1 --branch "$ref" "$url" "$path"
          done

      - name: Start the stack
        working-directory: servers/club-management-server
        env:
          PORT_TO_CHECK: ${{ matrix.port }}
        run: |
          docker compose up -d
          curl --retry 60 --retry-all-errors --retry-delay 5 -fsS "http://127.0.0.1:$PORT_TO_CHECK/" > /dev/null
          curl --retry 60 --retry-all-errors --retry-delay 5 -fsS "http://127.0.0.1:$PORT_TO_CHECK/api/health" > /dev/null

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/${{ matrix.project }}/package-lock.json

      - name: Cypress (mobile viewport)
        working-directory: e2e/${{ matrix.project }}
        run: |
          npm ci
          npx cypress install
          npx cypress run

      - name: Show stack logs
        if: failure()
        working-directory: servers/club-management-server
        run: docker compose logs --no-color --tail 100

  server:
    name: Server
    uses: ./.github/workflows/server.yml

  infra:
    name: Infra
    uses: ./.github/workflows/infra.yml
