name: AI Pipeline

# Integrated pipeline: checks every project together. For each project it uses the branch with the
# same name as this repository's branch, or main if there is none.

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [club-management-client, club-management-admin]
    defaults:
      run:
        working-directory: project
    steps:
      - name: Resolve project branch
        id: ref
        working-directory: .
        env:
          URL: https://github.com/${{ github.repository_owner }}/${{ matrix.project }}.git
        run: |
          if git ls-remote --exit-code "$URL" "refs/heads/$GITHUB_REF_NAME" >/dev/null; then
            echo "ref=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.project }}
          ref: ${{ steps.ref.outputs.ref }}
          path: project

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: project/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type check and build
        run: npm run build

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Component tests (Storybook)
        run: |
          npx playwright install --with-deps chromium
          npm run test:storybook

  node-service:
    name: Service (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project:
          - club-management-users-svc
          - club-management-scheduling-svc
          - club-management-payment-svc
          - club-management-championshp-svc
    defaults:
      run:
        working-directory: project
    steps:
      - name: Resolve project branch
        id: ref
        working-directory: .
        env:
          URL: https://github.com/${{ github.repository_owner }}/${{ matrix.project }}.git
        run: |
          if git ls-remote --exit-code "$URL" "refs/heads/$GITHUB_REF_NAME" >/dev/null; then
            echo "ref=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.project }}
          ref: ${{ steps.ref.outputs.ref }}
          path: project

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: project/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

  python-bff:
    name: BFF (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [club-management-client-bff, club-management-admin-bff]
    defaults:
      run:
        working-directory: project
    steps:
      - name: Resolve project branch
        id: ref
        working-directory: .
        env:
          URL: https://github.com/${{ github.repository_owner }}/${{ matrix.project }}.git
        run: |
          if git ls-remote --exit-code "$URL" "refs/heads/$GITHUB_REF_NAME" >/dev/null; then
            echo "ref=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.project }}
          ref: ${{ steps.ref.outputs.ref }}
          path: project

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: project/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (Ruff)
        run: ruff check .

      - name: Type check
        run: mypy .

      - name: Unit tests with coverage
        run: python scripts/run_coverage.py

  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [club-management-client, club-management-admin]
    steps:
      - uses: actions/checkout@v7

      - name: Resolve project branch
        id: ref
        env:
          URL: https://github.com/${{ github.repository_owner }}/${{ matrix.project }}.git
        run: |
          if git ls-remote --exit-code "$URL" "refs/heads/$GITHUB_REF_NAME" >/dev/null; then
            echo "ref=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.project }}
          ref: ${{ steps.ref.outputs.ref }}
          path: project

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            project/package-lock.json
            e2e/${{ matrix.project }}/package-lock.json

      - name: Build and start the app
        working-directory: project
        run: |
          npm ci
          npm run build
          nohup npm run preview -- --port 4173 --host 127.0.0.1 > preview.log 2>&1 &
          curl --retry 30 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:4173 > /dev/null

      - name: Cypress (mobile viewport)
        working-directory: e2e/${{ matrix.project }}
        run: |
          npm ci
          npx cypress install
          npx cypress run

  server:
    name: Server
    uses: ./.github/workflows/server.yml

  infra:
    name: Infra
    uses: ./.github/workflows/infra.yml
