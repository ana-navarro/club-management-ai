name: club-management

services:
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${CLIENT_PORT:-8080}:8080"
      - "${ADMIN_PORT:-8081}:8081"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - admin
      - client-bff
      - admin-bff

  client:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_USE_POLLING: "true"
    volumes:
      - ../../apps/club-management-client:/app
      - /app/node_modules

  admin:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_USE_POLLING: "true"
    volumes:
      - ../../apps/club-management-admin:/app
      - /app/node_modules

  client-bff:
    image: python:3.14-slim
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      USERS_SVC_URL: http://users-svc:3001
      SCHEDULING_SVC_URL: http://scheduling-svc:3002
      PAYMENT_SVC_URL: http://payment-svc:3003
      CHAMPIONSHIP_SVC_URL: http://championshp-svc:3004
    volumes:
      - ../../services/club-management-client-bff:/app
    depends_on:
      - users-svc
      - scheduling-svc
      - payment-svc
      - championshp-svc

  admin-bff:
    image: python:3.14-slim
    working_dir: /app
    command: sh -c "pip install -r requirements.txt && uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      USERS_SVC_URL: http://users-svc:3001
      SCHEDULING_SVC_URL: http://scheduling-svc:3002
      PAYMENT_SVC_URL: http://payment-svc:3003
      CHAMPIONSHIP_SVC_URL: http://championshp-svc:3004
    volumes:
      - ../../services/club-management-admin-bff:/app
    depends_on:
      - users-svc
      - scheduling-svc
      - payment-svc
      - championshp-svc

  users-svc:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      PORT: "3001"
    volumes:
      - ../../services/club-management-users-svc:/app
      - /app/node_modules

  scheduling-svc:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      PORT: "3002"
    volumes:
      - ../../services/club-management-scheduling-svc:/app
      - /app/node_modules

  payment-svc:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      PORT: "3003"
    volumes:
      - ../../services/club-management-payment-svc:/app
      - /app/node_modules

  championshp-svc:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      PORT: "3004"
    volumes:
      - ../../services/club-management-championshp-svc:/app
      - /app/node_modules
